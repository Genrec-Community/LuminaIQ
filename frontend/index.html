  <!-- FOUC Prevention: apply dark mode BEFORE paint so there's no white flash.
       This script is intentionally synchronous (no defer/async) so it blocks
       rendering until the class is set. Must be the first child of <head>. -->
  <script>
    (function() {
      try {
        var el = document.documentElement;
        var cached = JSON.parse(localStorage.getItem('lumina_theme_vars') || 'null');
        if (cached && cached.vars) {
          // Replay the last theme (see src/utils/themes.js) before React mounts
          if (cached.dark) el.classList.add('dark');
          for (var a in cached.attrs) { if (cached.attrs[a] != null) el.setAttribute(a, cached.attrs[a]); }
          for (var v in cached.vars) { el.style.setProperty(v, cached.vars[v]); }
        } else if (localStorage.getItem('lumina_dark_mode') === '1') {
          el.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
