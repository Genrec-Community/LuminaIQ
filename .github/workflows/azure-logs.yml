# Diagnostics: prints the Azure backend's recent logs and a few health probes.
name: Azure logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: Log lines to fetch
        default: "300"

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP || 'luminaiq' }}
      APP: luminaiq-api
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Status and probes
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp show -n "$APP" -g "$RG" --query "{state:properties.runningStatus,fqdn:properties.configuration.ingress.fqdn,revision:properties.latestRevisionName}" -o json
          az containerapp replica list -n "$APP" -g "$RG" --query "[].{name:name,state:properties.runningState,created:properties.createdTime}" -o table || true
          FQDN=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          echo "--- /health"; curl -s -m 20 "https://$FQDN/health"; echo
          echo "--- CORS preflight from the website"
          curl -s -m 20 -o /dev/null -D - -X OPTIONS "https://$FQDN/api/v1/documents/upload-url" \
            -H "Origin: https://witty-field-041424a00.5.azurestaticapps.net" \
            -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: authorization,content-type" | head -20
      - name: Application logs
        run: az containerapp logs show -n "$APP" -g "$RG" --type console --tail "${{ inputs.lines || 300 }}" --format text 2>&1 | tail -n "${{ inputs.lines || 300 }}"
      - name: System logs
        run: az containerapp logs show -n "$APP" -g "$RG" --type system --tail 60 --format text 2>&1 | tail -n 60
