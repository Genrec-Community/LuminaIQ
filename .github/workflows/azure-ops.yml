# One-off Azure operations for moving production onto the production-grade backend.
# Run by hand: Actions → Azure ops → Run workflow, then pick a task.
#   inspect   read-only: subscription, resources, Postgres availability, the NAMES (never values)
#             of the settings in the BACKEND_ENV secret and on the live Container App
#   create-db create the Azure Database for PostgreSQL server (pgvector on) and the app database,
#             and keep its connection string as the Container App secret "database-url"
#   migrate   copy the live data from Supabase into it (scripts/migrate_from_supabase.py);
#             needs the SUPABASE_DB_URL repository secret. dry_run=true writes no rows.
name: Azure ops

on:
  # A push of this file runs the read-only inspect task (and registers the workflow for manual runs)
  push:
    paths: [".github/workflows/azure-ops.yml"]
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        options: [inspect, create-db, migrate]
        default: inspect
      location:
        description: "create-db: Azure region (empty = try the defaults)"
        type: string
        default: ""
      sku:
        description: "create-db: size (empty = try Standard_B1ms then Standard_B2s)"
        type: string
        default: ""
      dry_run:
        description: "migrate: show the plan only"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: azure-ops
  cancel-in-progress: false

env:
  RG: ${{ vars.AZURE_RESOURCE_GROUP || 'luminaiq' }}
  LOCATION: ${{ vars.AZURE_LOCATION || 'centralindia' }}
  APP: luminaiq-api
  PG: luminaiq-db
  PG_DB: lumina
  PG_ADMIN: luminaiq
  TASK: ${{ inputs.task || 'inspect' }}
  DRY_RUN: ${{ inputs.dry_run == false && 'false' || 'true' }}

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Inspect
        if: env.TASK == 'inspect'
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          echo "## Subscription"; az account show --query "{name:name, state:state, quotaId:subscriptionPolicies.quotaId, spendingLimit:subscriptionPolicies.spendingLimit}" -o table
          echo "## Resources in $RG"; az resource list -g "$RG" --query "[].{name:name, type:type, location:location}" -o table
          echo "## Postgres flexible servers"; az postgres flexible-server list -g "$RG" --query "[].{name:name, state:state, version:version, sku:sku.name}" -o table 2>&1 | tail -5
          # Free-credit subscriptions can't create Postgres everywhere: show, per region, whether this
          # subscription is restricted there and which small sizes it may create (no resources are made).
          echo "## Postgres sizes this subscription may create, by region"
          for loc in centralindia southindia westindia southeastasia eastasia japaneast koreacentral uaenorth eastus eastus2 westus2 westus3 northeurope westeurope uksouth australiaeast; do
            out=$(az postgres flexible-server list-skus -l "$loc" -o json 2>&1) || { echo "$loc: $(echo "$out" | tail -1)"; continue; }
            echo "$out" | jq -r --arg loc "$loc" '.[0] as $c | "\($loc): restricted=\($c.restricted // "-") reason=\($c.reason // "-") | " + ([$c.supportedServerEditions[]? | select(.name=="Burstable" or .name=="GeneralPurpose") | .name + "(" + (.status // "?") + "):" + ([.supportedServerSkus[]? | select(.name|test("B1ms|B2s$|D2ds_v5|D2s_v3")) | .name + "=" + (.status // "?")] | join(","))] | join(" "))'
          done
          echo "## Setting names in BACKEND_ENV (values not shown)"
          printf '%s\n' "$BACKEND_ENV" | sed 's/\r$//' | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' | cut -d= -f1 | sort
          echo "## Env var names on $APP"
          az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].env[].name" -o tsv | sort
          echo "## Secret names on $APP"; az containerapp secret list -n "$APP" -g "$RG" --query "[].name" -o tsv | sort
          echo "## SUPABASE_DB_URL secret set: $([ -n "$SUPABASE_DB_URL" ] && echo yes || echo no)"

      - name: Create the Postgres server and database
        if: env.TASK == 'create-db'
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          az provider register --namespace Microsoft.DBforPostgreSQL --wait --only-show-errors
          state() {
            # ARM keeps a failed server's name (and region) until it is fully deleted, so ask ARM too
            local s; s=$(az postgres flexible-server list -g "$RG" --query "[?name=='$PG'].state | [0]" -o tsv 2>/dev/null || true)
            [ -n "$s" ] || { az resource list -g "$RG" -n "$PG" --resource-type Microsoft.DBforPostgreSQL/flexibleServers --query "[0].name" -o tsv 2>/dev/null | grep -q . && s=Dropping; }
            echo "$s"
          }
          # A failed create leaves a half-made server that Azure deletes on its own ("Dropping");
          # wait for that to finish instead of mistaking it for a working server.
          for _ in $(seq 1 60); do
            s=$(state); [ "$s" = "Dropping" ] || break
            echo "Waiting for a failed earlier attempt to be removed..."; sleep 20
          done
          s=$(state)
          [ "$s" != "Dropping" ] || { echo "::error::$PG is still being removed by Azure; run create-db again in a few minutes"; exit 1; }
          echo "Existing server state: ${s:-none}"
          if [ -z "$s" ]; then
            PASS="$(openssl rand -base64 36 | tr -dc 'A-Za-z0-9' | head -c 32)Aa1"
            echo "::add-mask::$PASS"
            # Burstable B1ms is plenty for today's data (resize later without moving data). Free-credit
            # subscriptions can't create every size in every region (SkuNotAvailable), so try the app's
            # region first, then the nearest ones, and a size up. Public access is limited by firewall
            # to Azure services (the Container App).
            created=""
            # inspect lists which regions and sizes this subscription may use; pass them as inputs
            LOCS="${{ inputs.location }}"; SKUS="${{ inputs.sku }}"
            for loc in ${LOCS:-$LOCATION southeastasia}; do
              for sku in ${SKUS:-Standard_B1ms Standard_B2s}; do
                case "$sku" in Standard_B*) tier=Burstable ;; Standard_E*) tier=MemoryOptimized ;; *) tier=GeneralPurpose ;; esac
                echo "Trying $sku ($tier) in $loc"
                if az postgres flexible-server create -n "$PG" -g "$RG" -l "$loc" \
                     --version 16 --tier "$tier" --sku-name "$sku" --storage-size 32 \
                     --admin-user "$PG_ADMIN" --admin-password "$PASS" \
                     --public-access 0.0.0.0 --backup-retention 7 --yes -o none; then
                  created="$sku in $loc"; break 2
                fi
                for _ in $(seq 1 45); do [ -z "$(state)" ] && break; echo "Waiting for Azure to remove the failed attempt..."; sleep 20; done
              done
            done
            [ -n "$created" ] || { echo "::error::No Postgres size could be created in any tried region"; exit 1; }
            echo "Created $created"
            URL="postgresql://$PG_ADMIN:$PASS@$PG.postgres.database.azure.com:5432/$PG_DB?sslmode=require"
            echo "::add-mask::$URL"
            # The Container App holds the connection string; nothing reads it until DATABASE_URL points at it.
            az containerapp secret set -n "$APP" -g "$RG" --secrets "database-url=$URL" -o none
          fi
          # pgvector and uuid-ossp must be allow-listed on Azure before CREATE EXTENSION works
          az postgres flexible-server parameter set -g "$RG" -s "$PG" --name azure.extensions --value "VECTOR,UUID-OSSP" -o none
          az postgres flexible-server db show -g "$RG" -s "$PG" -d "$PG_DB" >/dev/null 2>&1 || \
            az postgres flexible-server db create -g "$RG" -s "$PG" -d "$PG_DB" -o none
          az postgres flexible-server show -n "$PG" -g "$RG" --query "{name:name, state:state, version:version, sku:sku.name, host:fullyQualifiedDomainName}" -o table
          { echo "### Postgres"; echo "- Server \`$PG\` ready, database \`$PG_DB\`"; echo "- Connection string stored as the \`database-url\` secret on \`$APP\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Migrate the data from Supabase
        if: env.TASK == 'migrate'
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "$SOURCE_DATABASE_URL" ] || { echo "::error::Add the SUPABASE_DB_URL repository secret first (see AZURE_DATABASE_MIGRATION.md)"; exit 1; }
          az extension add --name containerapp --upgrade --only-show-errors
          DATABASE_URL=$(az containerapp secret show -n "$APP" -g "$RG" --secret-name database-url --query value -o tsv)
          echo "::add-mask::$DATABASE_URL"
          # Let this runner reach the server for the length of the copy
          IP=$(curl -s https://api.ipify.org)
          RULE="gha-${GITHUB_RUN_ID}"
          az postgres flexible-server firewall-rule create -g "$RG" -n "$PG" -r "$RULE" --start-ip-address "$IP" --end-ip-address "$IP" -o none
          trap 'az postgres flexible-server firewall-rule delete -g "$RG" -n "$PG" -r "$RULE" --yes -o none || true' EXIT
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cd backend
          uv sync --frozen --quiet
          export DATABASE_URL SOURCE_DATABASE_URL
          export SUPABASE_URL=https://unused.example SUPABASE_SERVICE_KEY=unused SECRET_KEY=migration-only
          if [ "$DRY_RUN" = "true" ]; then
            uv run python -m scripts.migrate_from_supabase --dry-run
          else
            uv run python -m scripts.migrate_from_supabase
          fi
