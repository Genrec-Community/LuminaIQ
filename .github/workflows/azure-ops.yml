# One-off Azure operations for moving production onto the production-grade backend.
# Run by hand: Actions → Azure ops → Run workflow, then pick a task.
#   inspect   read-only: subscription, resources, Postgres availability, the NAMES (never values)
#             of the settings in the BACKEND_ENV secret and on the live Container App
#   create-db create the Azure Database for PostgreSQL server (pgvector on) and the app database,
#             and keep its connection string as the Container App secret "database-url"
#   migrate   copy the live data from Supabase into it (scripts/migrate_from_supabase.py);
#             needs the SUPABASE_DB_URL repository secret. dry_run=true writes no rows.
#   move-account  copy the app database into another Azure account (AZURE_ACCOUNT_MOVE.md): creates the
#             database there, stops the old API, copies everything with pg_dump/pg_restore and compares
#             row counts. Needs NEW_AZURE_CREDENTIALS for the new account; AZURE_CREDENTIALS stays the
#             old one until the move is done. dry_run=true only checks both sides.
name: Azure ops

on:
  # A push of this file runs the read-only inspect task (and registers the workflow for manual runs)
  push:
    paths: [".github/workflows/azure-ops.yml"]
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        options: [inspect, create-db, migrate, move-account]
        default: inspect
      location:
        description: "create-db: Azure region (empty = try the defaults)"
        type: string
        default: ""
      sku:
        description: "create-db: size (empty = try Standard_B1ms then Standard_B2s)"
        type: string
        default: ""
      dry_run:
        description: "migrate / move-account: show the plan only"
        type: boolean
        default: true
      stop_old_api:
        description: "move-account: stop the old API first so nothing changes during the copy"
        type: boolean
        default: true
      overwrite_target:
        description: "move-account: replace a new-account database that already has data"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: azure-ops
  cancel-in-progress: false

env:
  RG: ${{ vars.AZURE_RESOURCE_GROUP || 'luminaiq' }}
  LOCATION: ${{ vars.AZURE_LOCATION || 'centralindia' }}
  APP: luminaiq-api
  ENVIRONMENT: luminaiq-env
  PG: ${{ vars.AZURE_PG_SERVER || 'luminaiq-db' }}
  PG_DB: lumina
  PG_ADMIN: luminaiq
  TASK: ${{ inputs.task || 'inspect' }}
  DRY_RUN: ${{ inputs.dry_run == false && 'false' || 'true' }}

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Inspect
        if: env.TASK == 'inspect'
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          echo "## Subscription"; az account show --query "{name:name, state:state, quotaId:subscriptionPolicies.quotaId, spendingLimit:subscriptionPolicies.spendingLimit}" -o table
          echo "## Resources in $RG"; az resource list -g "$RG" --query "[].{name:name, type:type, location:location}" -o table
          echo "## Postgres flexible servers"; az postgres flexible-server list -g "$RG" --query "[].{name:name, state:state, version:version, sku:sku.name}" -o table 2>&1 | tail -5
          # Free-credit subscriptions can't create Postgres everywhere: show, per region, whether this
          # subscription is restricted there and which small sizes it may create (no resources are made).
          echo "## Postgres sizes this subscription may create, by region"
          for loc in centralindia southindia westindia southeastasia eastasia japaneast koreacentral uaenorth eastus eastus2 westus2 westus3 northeurope westeurope uksouth australiaeast; do
            out=$(az postgres flexible-server list-skus -l "$loc" -o json 2>/tmp/err) || { echo "$loc: $(tail -1 /tmp/err)"; continue; }
            printf '%s' "$out" | jq -r --arg loc "$loc" '.[0] as $c | "\($loc): restricted=\($c.restricted // "-") reason=\($c.reason // "-") | " + ([$c.supportedServerEditions[]? | select(.name=="Burstable" or .name=="GeneralPurpose") | .name + "(" + (.status // "?") + "):" + ([.supportedServerSkus[]? | select(.name|test("B1ms|B2s$|D2ds_v5|D2s_v3")) | .name + "=" + (.status // "?")] | join(","))] | join(" "))' || echo "$loc: (could not read)"
          done
          echo "## Setting names in BACKEND_ENV (values not shown)"
          printf '%s\n' "$BACKEND_ENV" | sed 's/\r$//' | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' | cut -d= -f1 | sort
          echo "## Env var names on $APP"
          az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].env[].name" -o tsv | sort
          echo "## Secret names on $APP"; az containerapp secret list -n "$APP" -g "$RG" --query "[].name" -o tsv | sort
          echo "## SUPABASE_DB_URL secret set: $([ -n "$SUPABASE_DB_URL" ] && echo yes || echo no)"

      - name: Create the Postgres server and database
        if: env.TASK == 'create-db'
        env:
          LOCS: ${{ inputs.location }}
          SKUS: ${{ inputs.sku }}
        run: |
          .github/scripts/azure-create-db.sh
          { echo "### Postgres"; echo "- Server \`$PG\` ready, database \`$PG_DB\`"; echo "- Connection string stored as the \`database-url\` secret on \`$APP\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Migrate the data from Supabase
        if: env.TASK == 'migrate'
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "$SOURCE_DATABASE_URL" ] || { echo "::error::Add the SUPABASE_DB_URL repository secret first (see AZURE_DATABASE_MIGRATION.md)"; exit 1; }
          az extension add --name containerapp --upgrade --only-show-errors
          DATABASE_URL=$(az containerapp secret show -n "$APP" -g "$RG" --secret-name database-url --query value -o tsv)
          echo "::add-mask::$DATABASE_URL"
          # The server this app's database lives on (its name differs per account after a move)
          PG=$(sed -E 's#^[^@]*@([^.:/]+)\..*#\1#' <<< "$DATABASE_URL")
          # Let this runner reach the server for the length of the copy
          IP=$(curl -s https://api.ipify.org)
          RULE="gha-${GITHUB_RUN_ID}"
          az postgres flexible-server firewall-rule create -g "$RG" -s "$PG" -n "$RULE" --start-ip-address "$IP" --end-ip-address "$IP" -o none
          trap 'az postgres flexible-server firewall-rule delete -g "$RG" -s "$PG" -n "$RULE" --yes -o none || true' EXIT
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cd backend
          uv sync --frozen --quiet
          export DATABASE_URL SOURCE_DATABASE_URL
          export PYTHONUNBUFFERED=1
          # End connections a cancelled earlier copy may have left holding locks
          uv run python -c "import os; from scripts.migrate_from_supabase import end_stale_copies; end_stale_copies(os.environ['DATABASE_URL'])"
          # Vector columns must match the production embedding model (the schema reads EMBEDDING_DIMENSION)
          EMBEDDING_DIMENSION=$(az containerapp secret show -n "$APP" -g "$RG" --secret-name embedding-dimension --query value -o tsv 2>/dev/null || true)
          export EMBEDDING_DIMENSION="${EMBEDDING_DIMENSION:-1536}"
          echo "Embedding dimension: $EMBEDDING_DIMENSION"
          # A database prepared earlier with another size: resize its (still empty) vector columns
          uv run python - <<'PY'
          import os, psycopg
          dim = int(os.environ["EMBEDDING_DIMENSION"])
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as c:
              for table in ("chunks", "answer_cache"):
                  row = c.execute("SELECT format_type(atttypid, atttypmod) FROM pg_attribute "
                                  "WHERE attrelid = to_regclass(%s) AND attname = 'embedding'", (table,)).fetchone()
                  if not row or row[0] == f"vector({dim})":
                      continue
                  if c.execute(f"SELECT count(*) FROM {table}").fetchone()[0]:
                      raise SystemExit(f"{table}.embedding is {row[0]} with rows in it; expected vector({dim})")
                  c.execute(f"ALTER TABLE {table} ALTER COLUMN embedding TYPE vector({dim})")
                  print(f"{table}.embedding: {row[0]} -> vector({dim})")
          PY
          export SUPABASE_URL=https://unused.example SUPABASE_SERVICE_KEY=unused SECRET_KEY=migration-only
          # If the copy hangs, stop after 15 minutes and show what the database is waiting on
          status=0
          if [ "$DRY_RUN" = "true" ]; then
            timeout 900 uv run python -m scripts.migrate_from_supabase --dry-run || status=$?
          else
            timeout 900 uv run python -m scripts.migrate_from_supabase || status=$?
          fi
          if [ "$status" != 0 ]; then
            uv run python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as c:
              for r in c.execute("SELECT pid, application_name, state, wait_event_type, wait_event, "
                                 "now() - state_change, left(query, 90) FROM pg_stat_activity "
                                 "WHERE datname = current_database() AND pid <> pg_backend_pid()"):
                  print(r)
          PY
            exit "$status"
          fi

      # ---------------------------------------------------------------- move-account (AZURE_ACCOUNT_MOVE.md)
      # Signed in to the OLD account here (AZURE_CREDENTIALS).
      - name: "Move: open the old database"
        if: env.TASK == 'move-account'
        env:
          NEW_CREDS: ${{ secrets.NEW_AZURE_CREDENTIALS }}
          STOP_OLD_API: ${{ inputs.stop_old_api && 'true' || 'false' }}
        run: |
          set -euo pipefail
          [ -n "$NEW_CREDS" ] || { echo "::error::Add the NEW_AZURE_CREDENTIALS repository secret (the new account's service principal) first"; exit 1; }
          az extension add --name containerapp --upgrade --only-show-errors
          echo "Old account: $(az account show --query name -o tsv)"
          OLD_URL=$(az containerapp secret show -n "$APP" -g "$RG" --secret-name database-url --query value -o tsv)
          echo "::add-mask::$OLD_URL"
          OLD_PG=$(sed -E 's#^[^@]*@([^.:/]+)\..*#\1#' <<< "$OLD_URL")
          IP=$(curl -s https://api.ipify.org)
          az postgres flexible-server firewall-rule create -g "$RG" -s "$OLD_PG" -n "gha-${GITHUB_RUN_ID}" --start-ip-address "$IP" --end-ip-address "$IP" -o none
          { echo "OLD_URL=$OLD_URL"; echo "OLD_PG=$OLD_PG"; } >> "$GITHUB_ENV"
          if [ "$DRY_RUN" = "false" ] && [ "$STOP_OLD_API" = "true" ]; then
            # Nobody can change data while it is copied. To undo (move abandoned):
            #   az containerapp ingress enable -n luminaiq-api -g luminaiq --type external --target-port 8000
            az containerapp ingress disable -n "$APP" -g "$RG" -o none
            echo "Old API stopped taking requests (ingress off)"
          fi

      - uses: azure/login@v2
        if: env.TASK == 'move-account'
        with:
          creds: ${{ secrets.NEW_AZURE_CREDENTIALS }}

      # Signed in to the NEW account from here on.
      - name: "Move: create the database in the new account and copy"
        if: env.TASK == 'move-account'
        env:
          LOCS: ${{ inputs.location }}
          SKUS: ${{ inputs.sku }}
          OVERWRITE: ${{ inputs.overwrite_target && 'true' || 'false' }}
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          SUB=$(az account show --query id -o tsv)
          echo "New account: $(az account show --query name -o tsv)"
          # Server names are global, so the new one can't reuse the old name
          export PG="luminaiq-db-$(echo -n "$SUB" | sha1sum | cut -c1-8)"
          command -v pg_dump >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          pg_dump --version
          # Row counts of every table, one "table count" line each, to compare the two sides
          counts() {
            psql "$1" -XAt -F' ' -c "SELECT table_name, (xpath('/row/c/text()', query_to_xml(format('SELECT count(*) AS c FROM %I.%I', table_schema, table_name), false, true, '')))[1]::text FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE' ORDER BY 1"
          }
          echo "## Old database"; counts "$OLD_URL" | tee old_counts.txt | awk '{n+=$2} END {print NR " tables, " n " rows"}'
          if [ "$DRY_RUN" = "true" ]; then
            echo "## New account (dry run: nothing created)"
            az containerapp show -n "$APP" -g "$RG" --query name -o tsv 2>/dev/null || echo "$APP not there yet (will be created)"
            az postgres flexible-server show -n "$PG" -g "$RG" --query "{name:name, state:state}" -o tsv 2>/dev/null || echo "$PG not there yet (will be created)"
            exit 0
          fi
          .github/scripts/azure-create-db.sh
          NEW_URL=$(az containerapp secret show -n "$APP" -g "$RG" --secret-name database-url --query value -o tsv)
          echo "::add-mask::$NEW_URL"
          IP=$(curl -s https://api.ipify.org)
          RULE="gha-${GITHUB_RUN_ID}"
          az postgres flexible-server firewall-rule create -g "$RG" -s "$PG" -n "$RULE" --start-ip-address "$IP" --end-ip-address "$IP" -o none
          trap 'az postgres flexible-server firewall-rule delete -g "$RG" -s "$PG" -n "$RULE" --yes -o none || true' EXIT
          tables=$(psql "$NEW_URL" -XAt -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")
          clean=()
          if [ "$tables" != "0" ]; then
            [ "$OVERWRITE" = "true" ] || { echo "::error::The new database already has $tables tables. Re-run with overwrite_target only if nobody is using it yet."; exit 1; }
            clean=(--clean --if-exists)
          fi
          # One consistent snapshot of the old database, restored as-is (schema, data, migration history)
          pg_dump "$OLD_URL" -Fc --no-owner --no-privileges -f lumina.dump
          ls -lh lumina.dump
          status=0
          pg_restore -d "$NEW_URL" --no-owner --no-privileges --no-comments "${clean[@]}" lumina.dump 2> restore.log || status=$?
          if [ "$status" != 0 ]; then echo "pg_restore reported problems:"; tail -40 restore.log; fi
          echo "## New database"; counts "$NEW_URL" > new_counts.txt
          if diff old_counts.txt new_counts.txt > counts.diff; then
            echo "Every table has the same number of rows on both sides ($(wc -l < new_counts.txt) tables)."
          else
            echo "::error::Row counts differ (old < > new):"; cat counts.diff; exit 1
          fi
          { echo "### Moved"; echo "- Database \`$PG\` in the new account, $(wc -l < new_counts.txt) tables, row counts match"
            echo "- Next: replace AZURE_CREDENTIALS with the new account's, then run Deploy to Azure (AZURE_ACCOUNT_MOVE.md)"; } >> "$GITHUB_STEP_SUMMARY"

      # Back to the old account to remove this runner's firewall opening there
      - uses: azure/login@v2
        if: always() && env.TASK == 'move-account' && env.OLD_PG != ''
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: "Move: close the old database again"
        if: always() && env.TASK == 'move-account' && env.OLD_PG != ''
        run: az postgres flexible-server firewall-rule delete -g "$RG" -s "$OLD_PG" -n "gha-${GITHUB_RUN_ID}" --yes -o none || true
      - name: "Move failed: switch the old API back on"
        if: failure() && env.TASK == 'move-account' && env.OLD_PG != '' && inputs.stop_old_api && inputs.dry_run == false
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp ingress enable -n "$APP" -g "$RG" --type external --target-port 8000 -o none
          echo "::warning::The move failed; the old API is serving again, nothing was switched."
