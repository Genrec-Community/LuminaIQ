# Hand-run operations on the AWS server (see AWS.md). Actions → AWS ops → Run workflow.
#   status            containers, disk, memory, API health, recent API logs
#   migrate-supabase  copy the app data from the Supabase database (SUPABASE_DB_URL secret) into the
#                     server's Postgres with scripts/migrate_from_supabase.py; dry_run shows the plan only
#   reindex           queue re-index jobs for books that have no search passages yet
#   backup            take a database backup to S3 now
#   set-embedding-dim change the vector columns to the deployed EMBEDDING_DIMENSION (empties chunks and
#                     answer_cache: run reindex after)
#   keypair           make the server's own key pair (once) and print its public key
#   install-secret    decrypt deploy/aws/ops/secret.enc (encrypted to that public key) into
#                     /opt/luminaiq/local.env, which deploy.sh adds to the settings
name: AWS ops

on:
  push:
    branches: [claude/move-to-aws]
    # Until this workflow is on main (manual runs need that), a push of deploy/aws/ops-task runs the
    # task written in it: "<task> [dry_run=true|false] [reindex=true|false]"
    paths: ["deploy/aws/ops-task", "deploy/aws/ops/**"]
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [status, migrate-supabase, reindex, backup, set-embedding-dim, bedrock-test, keypair, install-secret, ai-check, models-test, script]
        default: status
      dry_run:
        type: boolean
        default: true
      reindex:
        description: "migrate-supabase: queue book re-indexing after the copy"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-ops
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::524554316555:role/luminaiq-github-deploy
          aws-region: ap-southeast-2

      - name: Which task
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            read -r T A B < deploy/aws/ops-task
          else
            T="${{ inputs.task }}"; A="dry_run=${{ inputs.dry_run }}"; B="reindex=${{ inputs.reindex }}"
          fi
          echo "TASK=$T" >> "$GITHUB_ENV"
          [ "$T" = "script" ] && echo "SCRIPT=$A" >> "$GITHUB_ENV"
          DRY=true; RE=true
          for kv in $A $B; do case "$kv" in dry_run=*) DRY=${kv#*=} ;; reindex=*) RE=${kv#*=} ;; esac; done
          echo "DRY_RUN=$DRY" >> "$GITHUB_ENV"; echo "REINDEX=$RE" >> "$GITHUB_ENV"
          echo "task=$T dry_run=$DRY reindex=$RE"

      - name: Status
        if: env.TASK == 'status'
        run: |
          for u in https://3-105-245-239.sslip.io/health https://3-105-245-239.sslip.io/ https://luminaiq.fun/health; do
            curl -s -m 20 -o /dev/null -w "%{http_code} %{time_total}s $u\n" "$u" || echo "fail $u"; done
          .github/scripts/aws-run.sh 'cd /opt/luminaiq && docker compose ps && df -h / && free -m && docker compose exec -T api curl -s http://localhost:8000/ready; echo; docker compose logs --tail 120 api'

      - name: Copy data from Supabase
        if: env.TASK == 'migrate-supabase'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::SUPABASE_DB_URL secret is empty"; exit 1; }
          aws ssm put-parameter --name /luminaiq/secret/SUPABASE_DB_URL --type SecureString --overwrite --value "$SUPABASE_DB_URL" >/dev/null
          FLAGS=""
          [ "$DRY_RUN" = "false" ] || FLAGS="--dry-run"
          [ "$REINDEX" = "false" ] && FLAGS="$FLAGS --no-reindex" || true
          .github/scripts/aws-run.sh "cd /opt/luminaiq && SRC=\$(aws ssm get-parameter --region $AWS_REGION --name /luminaiq/secret/SUPABASE_DB_URL --with-decryption --query Parameter.Value --output text) && docker compose exec -T -e SOURCE_DATABASE_URL=\"\$SRC\" api uv run --no-sync python -m scripts.migrate_from_supabase $FLAGS 2>&1 | tail -150" 3000

      - name: Queue re-indexing
        if: env.TASK == 'reindex'
        run: |
          .github/scripts/aws-run.sh "cd /opt/luminaiq && docker compose exec -T api uv run --no-sync python -c \"import os, psycopg; from scripts.migrate_from_supabase import queue_reindex; c = psycopg.connect(os.environ['DATABASE_URL'], autocommit=True); print('queued', queue_reindex(c))\""

      - name: Backup now
        if: env.TASK == 'backup'
        run: .github/scripts/aws-run.sh "/opt/luminaiq/backup.sh && echo done"

      - name: Change the embedding size
        if: env.TASK == 'set-embedding-dim'
        run: |
          .github/scripts/aws-run.sh "cd /opt/luminaiq && D=\$(grep '^EMBEDDING_DIMENSION=' backend.env | cut -d= -f2) && echo dim=\$D && docker compose exec -T postgres psql -U lumina -d lumina -v ON_ERROR_STOP=1 -c \"TRUNCATE chunks, answer_cache; ALTER TABLE chunks ALTER COLUMN embedding TYPE vector(\$D); ALTER TABLE answer_cache ALTER COLUMN embedding TYPE vector(\$D);\" && docker compose restart api"

      - name: Which Bedrock models work
        if: env.TASK == 'bedrock-test'
        run: |
          B=$(base64 -w0 deploy/aws/ops/bedrock_test.py)
          .github/scripts/aws-run.sh "cd /opt/luminaiq && echo $B | base64 -d > /tmp/bt.py && docker compose cp /tmp/bt.py api:/tmp/bt.py && docker compose exec -T api uv run --no-sync python /tmp/bt.py"

      - name: Server key pair
        if: env.TASK == 'keypair'
        run: |
          .github/scripts/aws-run.sh "cd /opt/luminaiq && umask 077 && { [ -f ops.pem ] || openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out ops.pem 2>/dev/null; } && openssl pkey -in ops.pem -pubout"

      - name: Install a secret
        if: env.TASK == 'install-secret'
        run: |
          B=$(tr -d '\n' < deploy/aws/ops/secret.enc)
          .github/scripts/aws-run.sh "cd /opt/luminaiq && umask 077 && echo $B | base64 -d | openssl pkeyutl -decrypt -inkey ops.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 > local.env.new && mv local.env.new local.env && cut -d= -f1 local.env"

      - name: AI check
        if: env.TASK == 'ai-check'
        run: |
          B=$(base64 -w0 deploy/aws/ops/ai_check.py)
          .github/scripts/aws-run.sh "cd /opt/luminaiq && echo $B | base64 -d > /tmp/ac.py && docker compose cp /tmp/ac.py api:/app/ac_tmp.py && docker compose exec -T -w /app api uv run --no-sync python ac_tmp.py 2>&1 | tail -40; docker compose exec -T api rm -f /app/ac_tmp.py"

      # Runs deploy/aws/ops/<SCRIPT> in the api container; whatever it writes to /app/ops_out/ comes
      # back as the "ops-output" artifact (SSM only returns the last 20 KB of printed output)
      - name: Script
        if: env.TASK == 'script'
        env:
          BUCKET: luminaiq-backups-524554316555
        run: |
          B=$(base64 -w0 "deploy/aws/ops/$SCRIPT")
          .github/scripts/aws-run.sh "cd /opt/luminaiq && echo $B | base64 -d > /tmp/os.py && docker compose cp /tmp/os.py api:/app/os_tmp.py && docker compose exec -T -w /app api sh -c 'rm -rf /app/ops_out && mkdir -p /app/ops_out && uv run --no-sync python os_tmp.py' 2>&1 | tail -60; rm -rf /tmp/ops_out && docker compose cp api:/app/ops_out /tmp/ops_out && aws s3 cp --recursive /tmp/ops_out s3://$BUCKET/ops/out/ --sse AES256 --only-show-errors; docker compose exec -T api rm -rf /app/os_tmp.py /app/ops_out" 1800
          mkdir -p out && aws s3 cp --recursive "s3://$BUCKET/ops/out/" out/ --only-show-errors && aws s3 rm --recursive "s3://$BUCKET/ops/out/" --only-show-errors || true
      - name: Show script output
        if: env.TASK == 'script'
        run: for f in out/*; do echo "===== $f ($(wc -c < "$f") bytes)"; case "$f" in *.md|*.txt) cat "$f" ;; *) head -c 3000 "$f" ;; esac; done
      - uses: actions/upload-artifact@v4
        if: env.TASK == 'script'
        with:
          name: ops-output
          path: out/
          retention-days: 3

      - name: Models test
        if: env.TASK == 'models-test'
        run: |
          B=$(base64 -w0 deploy/aws/ops/models_test.py)
          .github/scripts/aws-run.sh "cd /opt/luminaiq && echo $B | base64 -d > /tmp/mt.py && docker compose cp /tmp/mt.py api:/tmp/mt.py && docker compose exec -T api uv run --no-sync python /tmp/mt.py 2>&1 | tail -40" 900
