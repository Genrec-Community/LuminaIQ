name: OCR service

# Builds the Indra OCR service image and runs it with Render's free limits
# (512 MB, 0.1 CPU) on realistic scanned spreads: speed, peak memory, accuracy.
on:
  push:
    branches: [jaisamyukth-changes]
    paths: ['ocr-service/**', '.github/workflows/ocr-service.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lumina-ocr ocr-service
      - name: Test tools
        run: pip install pillow requests
      - name: Like Render free (512 MB, 0.1 CPU)
        run: |
          docker run -d --name ocr-free --memory 512m --memory-swap 512m --cpus 0.1 -e OCR_TOKEN=ci -p 8080:10000 lumina-ocr
          python ocr-service/ci_test.py --url http://127.0.0.1:8080 --token ci --pages 4 --label "free 0.1 CPU"
          echo "peak memory: $(( $(docker exec ocr-free cat /sys/fs/cgroup/memory.peak) / 1048576 )) MB"
          docker inspect -f 'OOM killed: {{.State.OOMKilled}}' ocr-free
      - name: Like Render Starter (512 MB, 0.5 CPU), for comparison
        if: always()
        run: |
          docker run -d --name ocr-starter --memory 512m --memory-swap 512m --cpus 0.5 -e OCR_TOKEN=ci -p 8081:10000 lumina-ocr
          python ocr-service/ci_test.py --url http://127.0.0.1:8081 --token ci --pages 4 --label "0.5 CPU"
          echo "peak memory: $(( $(docker exec ocr-starter cat /sys/fs/cgroup/memory.peak) / 1048576 )) MB"
      - name: Logs
        if: always()
        run: docker logs ocr-free 2>&1 | tail -40
